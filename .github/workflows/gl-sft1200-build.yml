name: Siflower 1806 SDK Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-20.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.ccache
            1806_SDK/openwrt-18.06/dl
            1806_SDK/openwrt-18.06/feeds
            1806_SDK/openwrt-18.06/build_dir
            1806_SDK/openwrt-18.06/staging_dir
            1806_SDK/openwrt-18.06/tmp
          key: ${{ runner.os }}-sdk-${{ hashFiles('1806_SDK/openwrt-18.06/.config') }}
          restore-keys: |
            ${{ runner.os }}-sdk-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses5-dev \
          libncursesw5-dev libssl-dev python python2.7-dev python3 unzip wget \
          python3-distutils python3-setuptools rsync subversion swig time \
          xsltproc zlib1g-dev

      - name: Setup ccache
        run: |
          mkdir -p ~/.ccache
          echo "max_size = 10G" > ~/.ccache/ccache.conf
          echo "export PATH=/usr/lib/ccache:$PATH" >> $GITHUB_ENV

      - name: Clone and prepare SDK
        run: |
          git clone --depth=1 https://github.com/Siflower/1806_SDK.git
          cd 1806_SDK/openwrt-18.06
          cp feeds.conf.default feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add Xray package
        run: |
          cd 1806_SDK/openwrt-18.06
          git clone https://github.com/yichya/luci-app-xray.git package/luci-app-xray

      - name: Configure Build
        run: |
          cd 1806_SDK/openwrt-18.06
          cp configs/sft1200_config .config
          echo 'CONFIG_PACKAGE_luci-app-xray=y' >> .config
          echo 'CONFIG_CCACHE=y' >> .config
          make defconfig

      - name: Build firmware
        run: |
          cd 1806_SDK/openwrt-18.06
          make download -j8
          make -j$(nproc) V=s || make -j1 V=s

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: siflower-firmware
          path: 1806_SDK/openwrt-18.06/bin/targets/

      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          files: 1806_SDK/openwrt-18.06/bin/targets/**/*
          name: Release ${{ github.sha }}
          tag_name: release-${{ github.sha }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ccache stats
        run: ccache -s
